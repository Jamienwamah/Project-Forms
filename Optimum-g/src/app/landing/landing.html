<div class="min-h-screen bg-slate-50 text-slate-800 font-sans">
  
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-lg">
          F
        </div>
        <span class="font-bold text-xl tracking-tight text-slate-900">Form Portal</span>
      </div>
      <span class="text-xs font-medium bg-slate-100 text-slate-600 px-3 py-1 rounded-full border border-slate-200">
        Internal Forms Directory
      </span>
    </div>
  </header>

  <!-- Content Body -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
    <div class="text-center max-w-2xl mx-auto mb-8">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
        Corporate Forms Directory
      </h1>
      <p class="mt-3 text-slate-600 text-base">
        Select a form below to fill out and submit directly within the application.
      </p>

      <!-- Search -->
      <div class="mt-6 relative max-w-md mx-auto">
        <input 
          type="text" 
          [(ngModel)]="searchQuery"
          placeholder="Search forms..." 
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
        />
        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <!-- Category Filters -->
    <div class="flex items-center justify-center space-x-2 overflow-x-auto pb-4 mb-8">
      <button 
        *ngFor="let cat of categories"
        (click)="selectedCategory = cat"
        [ngClass]="{
          'bg-indigo-600 text-white shadow-sm': selectedCategory === cat,
          'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100': selectedCategory !== cat
        }"
        class="px-4 py-1.5 rounded-full text-xs font-semibold cursor-pointer">
        {{ cat }}
      </button>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div 
        *ngFor="let form of filteredForms"
        [routerLink]="form.routePath"
        class="group bg-white rounded-2xl border border-slate-200 p-6 shadow-sm hover:shadow-md hover:border-indigo-300 transition duration-200 cursor-pointer flex flex-col justify-between">
        
        <div>
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
              {{ form.category }}
            </span>
            <span *ngIf="form.badge" class="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full">
              {{ form.badge }}
            </span>
          </div>

          <h3 class="text-lg font-bold text-slate-900 group-hover:text-indigo-600 transition">
            {{ form.title }}
          </h3>

          <p class="text-slate-600 text-sm mt-2 line-clamp-2">
            {{ form.description }}
          </p>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-semibold text-indigo-600">
          <span>Fill Out Form</span>
          <svg class="w-4 h-4 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </div>
      </div>
    </div>
  </main>
</div>
